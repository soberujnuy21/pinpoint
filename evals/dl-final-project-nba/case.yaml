expected_outcome: |
  실제 결과 46.26/50. 교수 피드백: UI/UX에 치중해 설계적 엄밀성이 약함. Q&A에서 '이 모델은? 저 모델은?'에 '써봤는데 성능이 안 좋았다' 외에 답하지 못함. 판정은 버린 모델의 해석·선택 이유 누락, 웹 데모 과몰입, 하이퍼파라미터 설명 부족을 잡고, 큰 실패가 아닌 마지막 점수 손실로 다뤄야 한다.
  입력 파일은 저장소의 cases/ 폴더 원본을 가리킨다(개인 자료라 files/로 복사하지 않음).
